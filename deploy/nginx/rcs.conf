# RCS reverse proxy for the pilot. Install as /etc/nginx/sites-available/rcs and symlink into sites-enabled.
#
# What this achieves:
#   - the employee reaches ONE address over HTTPS, by hostname, on the LAN;
#   - Kestrel stays bound to 127.0.0.1, so nothing but nginx can reach the application;
#   - PostgreSQL is not exposed at all (it listens on a Unix socket);
#   - uploads up to 500 MB pass through, matching the application's own limit (ADR-042).
#
# The certificate is issued by the organisation's internal CA, or is a self-signed certificate generated on this
# server and installed as trusted on the pilot workstation (docs/PILOT_DEPLOYMENT.md). No ACME, no public CA, no
# Internet dependency of any kind.

server {
    listen 80;
    listen [::]:80;
    server_name rcs.example.lan;

    # Plain HTTP exists only to send people to HTTPS.
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rcs.example.lan;

    ssl_certificate     /etc/ssl/rcs/rcs.example.lan.crt;
    ssl_certificate_key /etc/ssl/rcs/rcs.example.lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RCS:10m;

    # A LAN-only application: no HSTS preload, but a plain max-age is safe once HTTPS works on this hostname.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 500 MB per file (ADR-042), enforced here AND in the application.
    client_max_body_size 512m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # Large uploads stream through rather than being buffered to disk twice.
    proxy_request_buffering off;

    access_log /var/log/nginx/rcs.access.log;
    error_log  /var/log/nginx/rcs.error.log;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoints answer without a session; keep them on the LAN like everything else.
    location /health/ {
        proxy_pass http://127.0.0.1:5080;
        access_log off;
    }
}
